<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><rect width="880" height="250" rx="8" fill="#fcfcfb"/><text x="24.0" y="30.0" fill="#0b0b0b" font-size="15" font-weight="600" text-anchor="start">How far a label's room point lands from the object's true middle</text><text x="24.0" y="50.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">Mean of 35 views with true boxes (laptop, vase, chair, plant), 18 Nov. Shorter is better.</text><line x1="236.0" y1="64" x2="236.0" y2="202" stroke="#e1e0d9" stroke-width="1"/><text x="236.0" y="220.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">0 cm</text><line x1="306.6" y1="64" x2="306.6" y2="202" stroke="#e1e0d9" stroke-width="1"/><text x="306.6" y="220.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">5 cm</text><line x1="377.1" y1="64" x2="377.1" y2="202" stroke="#e1e0d9" stroke-width="1"/><text x="377.1" y="220.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">10 cm</text><line x1="447.7" y1="64" x2="447.7" y2="202" stroke="#e1e0d9" stroke-width="1"/><text x="447.7" y="220.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">15 cm</text><line x1="518.3" y1="64" x2="518.3" y2="202" stroke="#e1e0d9" stroke-width="1"/><text x="518.3" y="220.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">20 cm</text><line x1="588.9" y1="64" x2="588.9" y2="202" stroke="#e1e0d9" stroke-width="1"/><text x="588.9" y="220.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">25 cm</text><line x1="659.4" y1="64" x2="659.4" y2="202" stroke="#e1e0d9" stroke-width="1"/><text x="659.4" y="220.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">30 cm</text><line x1="730.0" y1="64" x2="730.0" y2="202" stroke="#e1e0d9" stroke-width="1"/><text x="730.0" y="220.0" fill="#898781" font-size="12" font-weight="400" text-anchor="middle">35 cm</text><path d="M236 70 H675.2 Q679.2 70 679.2 74 V96 Q679.2 100 675.2 100 H236 Z" fill="#a8a69e"/><text x="224.0" y="89.0" fill="#52514e" font-size="13" font-weight="400" text-anchor="end">Ray through the box centre</text><text x="689.2" y="89.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">31.4 cm  (median 22.9)</text><path d="M236 118 H536.9 Q540.9 118 540.9 122 V144 Q540.9 148 536.9 148 H236 Z" fill="#a8a69e"/><text x="224.0" y="137.0" fill="#52514e" font-size="13" font-weight="400" text-anchor="end">Ray through the bottom edge</text><text x="550.9" y="137.0" fill="#52514e" font-size="12" font-weight="400" text-anchor="start">21.6 cm  (median 18.7)</text><path d="M236 166 H397.1 Q401.1 166 401.1 170 V192 Q401.1 196 397.1 196 H236 Z" fill="#2a78d6"/><text x="224.0" y="185.0" fill="#0b0b0b" font-size="13" font-weight="600" text-anchor="end">Bottom edge, moved back (used)</text><text x="411.1" y="185.0" fill="#0b0b0b" font-size="12" font-weight="600" text-anchor="start">11.7 cm  (median 6.6)</text></svg>
